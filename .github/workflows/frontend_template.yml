name: Frontend template

on:
  workflow_call:
    inputs:
      publish_and_tag:
        description: "Publish and create a new tag or not"
        required: true
        type: string
      VERSION_PATH:
        type: string
        required: true
        default: ""
      IMAGE_NAME:
        type: string
        required: true
        default: "image"
      TEST:
        type: boolean
        required: false
        default: false
      DEPLOY_COMPONENT:
        description: "This app's subchart in the head chart (frontend). Set, it adds a manual deploy-to-stage button after the image build; needs a stage environment in the calling repo"
        type: string
        required: false
        default: ""
    secrets:
      NPMJS_TOKEN:
        required: true
      SENTINEL_PULL:
        required: true
      DEPLOY_APP_PRIVATE_KEY:
        description: "Needed with DEPLOY_COMPONENT. Pass it by name (secrets.DEPLOY_APP_PRIVATE_KEY) although it exists only in the stage environment; deploy_stage then gets the environment's value"
        required: false

jobs:
  get_current_version:
    uses: cyberrangecz/actions-templates/.github/workflows/get_version.yml@master
    with:
      file_path: ${{ inputs.VERSION_PATH }}

  codeStyle:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.3.0'
          cache: 'npm'

      - name: Copy .npmrc for authentication
        run: echo "${{ secrets.SENTINEL_PULL }}" >> .npmrc

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Run Lint
        run: npx nx run-many --all --skip-nx-cache --parallel --targets=lint
        continue-on-error: true # remove after fixing lint issues

  unitTests:
    if: ${{ inputs.TEST }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.CONTAINER_IMAGE }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.3.0'
          cache: 'npm'

      - name: Copy .npmrc for authentication
        run: echo "${{ secrets.SENTINEL_PULL }}" >> .npmrc

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Run tests
        run: npm run ci-test

  build_container:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: [codeStyle, get_current_version] # add unitTests when created
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy .npmrc for authentication
        run: echo "${{ secrets.SENTINEL_PULL }}" >> .npmrc

      # master builds the release tag, every other branch the -dev tag
      - name: Set image tag
        id: tag
        env:
          VERSION: ${{ needs.get_current_version.outputs.version }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/master ]; then tag="$VERSION"; else tag="${VERSION}-dev"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: push
        env:
          IMAGE_NAME:  ${{ inputs.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          PROD_VAL: ${{ github.ref == 'refs/heads/master' && 'true' || 'false' }}
        uses: docker/build-push-action@v7
        with:
          context: .  # Path to the Dockerfile
          file: ./Dockerfile
          build-args: |
            PROD=${{ env.PROD_VAL }}
            --snapshotMode=redo
            --single-snapshot
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  # Manual deploy-to-stage button: waits for a reviewer to approve the stage environment,
  # then sends this build to tf-crczp-kubernetes. The App credentials are the stage
  # environment's DEPLOY_APP_CLIENT_ID variable and DEPLOY_APP_PRIVATE_KEY secret.
  # The caller must pass the secret by name: an environment secret it doesn't pass is an
  # empty string in a reusable workflow.
  deploy_stage:
    if: inputs.DEPLOY_COMPONENT != ''
    needs: build_container
    runs-on: ubuntu-24.04
    permissions: {}
    environment: stage
    steps:
      - name: Deploy to stage
        uses: cyberrangecz/actions-templates/.github/actions/deploy-dispatch@master
        with:
          component: ${{ inputs.DEPLOY_COMPONENT }}
          tag: ${{ needs.build_container.outputs.tag }}
          digest: ${{ needs.build_container.outputs.digest }}
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

  # Controls if version consistent with semver and higner than last git tag.
  control_tag:
    if: github.event.pull_request.base.ref == 'master' || github.ref == 'refs/heads/master'
    needs: get_current_version
    uses: cyberrangecz/actions-templates/.github/workflows/tag_control_template.yml@master
    with:
      VERSION: ${{ needs.get_current_version.outputs.version }}

  # Push tag only from manual workflow_dispatch with confirmed tag creation
  push_tag:
    if: ${{ github.ref == 'refs/heads/master' && inputs.publish_and_tag == 'yes' }}
    needs: [get_current_version, control_tag, build_container]
    uses: cyberrangecz/actions-templates/.github/workflows/tag_push_template.yml@master
    with:
      VERSION: ${{ needs.get_current_version.outputs.version }}
