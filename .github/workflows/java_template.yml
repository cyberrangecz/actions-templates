name: Java template

on:
  workflow_call:
    inputs:
      publish_and_tag:
        description: "Publish and create a new tag or not"
        required: true
        type: string
      MAVEN_CLI_OPTS:
        type: string
        required: true
        default: ""
      IMAGE_NAME:
        type: string
        required: true
        default: "image"
      VERSION_PATH:
        type: string
        required: true
        default: ""
      JAVA_VERSION:
        type: string
        required: false
        default: "25"
      skip_docs:
        description: "Skip generating and publishing static Swagger docs to GitHub Pages (e.g. for repos serving docs at runtime instead)"
        type: boolean
        required: false
        default: false
      FAIL_BUILD_ON_CVSS:
        description: "CVSS score at or above which OWASP Dependency-Check fails the build (11 = never fail)"
        type: string
        required: false
        default: "9"
      NVD_DB_TAG:
        description: "Tag of ghcr.io/cyberrangecz/nvd-db to restore, must match the dependency-check major version in pom.xml"
        type: string
        required: false
        default: "13"
    secrets:
      NVD_API:
        required: true
      OSS_INDEX_USER:
        required: true
      OSS_INDEX_TOKEN:
        required: true

env:
  GITHUB_WORKSPACE: ${{ github.workspace }}
  NVD_API_TOKEN: ${{ secrets.NVD_API }}
  FAIL_BUILD_ON_CVSS: ${{ inputs.FAIL_BUILD_ON_CVSS }}
  OSS_INDEX_USER: ${{ secrets.OSS_INDEX_USER }}
  OSS_INDEX_TOKEN: ${{ secrets.OSS_INDEX_TOKEN }}

jobs:
  get_current_version:
    uses: cyberrangecz/actions-templates/.github/workflows/get_version.yml@master
    with:
      file_path: ${{ inputs.VERSION_PATH }}

  code_quality:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NVD_DATA_DIR: ${{ github.workspace }}/.nvd-data
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Restore NVD snapshot
        env:
          NVD_DB_IMAGE: ghcr.io/cyberrangecz/nvd-db:${{ inputs.NVD_DB_TAG }}
        run: |
          mkdir -p "$NVD_DATA_DIR"
          if docker create --name nvd "$NVD_DB_IMAGE" noop; then
            docker cp nvd:/data/. "$NVD_DATA_DIR"
            docker rm nvd
          else
            echo "::warning::No NVD snapshot found ($NVD_DB_IMAGE), falling back to full download"
          fi

      - name: Build with Maven
        timeout-minutes: 25
        env:
          # Shared suppressions, ignored by repos whose pom.xml sets <suppressionFile> itself
          DC_SUPPRESSION_FILE: https://raw.githubusercontent.com/cyberrangecz/actions-templates/master/dependency-check/suppressions.xml
        run: |
          mvn -ntp clean install ${{ inputs.MAVEN_CLI_OPTS }} -s .github/workflows/settings.xml -DsuppressionFile="$DC_SUPPRESSION_FILE"

  build_container:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: [code_quality, get_current_version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE_NAME: ${{ inputs.IMAGE_NAME }}-service
          IMAGE_TAG: ${{ github.ref == 'refs/heads/master' && format('{0}', needs.get_current_version.outputs.version ) || format('{0}-dev', needs.get_current_version.outputs.version) }}
        uses: docker/build-push-action@v7
        with:
          context: .  # Path to the Dockerfile
          file: ./Dockerfile
          build-args: |
            MAVEN_CLI_OPTS=${{ inputs.MAVEN_CLI_OPTS }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  generate_docs:
    if: github.ref == 'refs/heads/master' && inputs.skip_docs != true
    runs-on: ubuntu-24.04
    needs: code_quality
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate and Push Swagger Docs
        run: |
          mvn -ntp clean package ${{ inputs.MAVEN_CLI_OPTS }} -DskipTests -DskipChecks=true -Dswagger.skip=false

      - name: Upload Docs files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc-files/

  upload_docs:
    needs: generate_docs
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
          
  # Controls if version consistent with semver and higner than last git tag.
  control_tag:
    if: github.event.pull_request.base.ref == 'master' || github.ref == 'refs/heads/master'
    needs: get_current_version
    uses: cyberrangecz/actions-templates/.github/workflows/tag_control_template.yml@master
    with:
      VERSION: ${{ needs.get_current_version.outputs.version }}

  # Push tag only from manual workflow_dispatch with confirmed tag creation
  push_tag:
    if: ${{ github.ref == 'refs/heads/master' && inputs.publish_and_tag == 'yes' }}
    needs: [get_current_version, control_tag, build_container]
    uses: cyberrangecz/actions-templates/.github/workflows/tag_push_template.yml@master
    with:
      VERSION: ${{ needs.get_current_version.outputs.version }}
